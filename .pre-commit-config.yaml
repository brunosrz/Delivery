# Arquivos gerados (wrangler types, drizzle-kit) não são reformatados à mão.
exclude: ^apps/api/(src/worker-configuration.d.ts|migrations/meta/)
default_language_version:
  node: system
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier-check
        entry: bunx prettier --check --ignore-unknown
        language: system
        types: [text]
      - id: eslint
        name: eslint
        entry: bun run lint
        language: system
        files: \.(ts|tsx|js|mjs)$
        pass_filenames: false
      - id: typecheck
        name: typescript typecheck
        entry: bun run typecheck
        language: system
        pass_filenames: false
      - id: api-migrations
        name: api migrations (journal, snapshots, rollbacks)
        entry: node --test scripts/tests/migrations-integrity.test.mjs scripts/tests/migrations-rollback.test.mjs
        language: system
        files: ^apps/api/(migrations|migrations-rollback)/
        pass_filenames: false
      - id: api-schema-drift
        name: api schema without drift from migrations
        entry: node apps/api/scripts/check-schema-drift.mjs
        language: system
        files: ^apps/api/(src/db/|migrations/|drizzle\.config\.ts)
        pass_filenames: false
