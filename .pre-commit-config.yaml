default_language_version:
  node: system
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier-check
        entry: pnpm exec prettier --check
        language: system
        files: ^(lib/order-totals\.ts|tests/unit/order-totals\.test\.ts|vitest\.config\.ts|package\.json)$
      - id: typecheck
        name: typescript typecheck
        entry: pnpm typecheck
        language: system
        pass_filenames: false
