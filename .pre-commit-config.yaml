default_language_version:
  node: system
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier-check
        entry: pnpm exec prettier --check --ignore-unknown
        language: system
        types: [text]
      - id: eslint
        name: eslint
        entry: pnpm lint
        language: system
        files: \.(ts|tsx|js|mjs)$
        pass_filenames: false
      - id: typecheck
        name: typescript typecheck
        entry: pnpm typecheck
        language: system
        pass_filenames: false
