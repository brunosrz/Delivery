packages:
  - apps/*
  - packages/*

# Dependências autorizadas a executar scripts de instalação (pnpm 11 bloqueia as demais).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.4.11"
  - miniflare@5.20261023.3-beta
  - wrangler@4.156.0
