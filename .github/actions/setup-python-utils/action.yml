name: Setup Python utils
description: Python e dependências dos utilitários de release em utils/ (pydantic e pytest).

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.13"
    - shell: bash
      run: python -m pip install --quiet pydantic pytest
