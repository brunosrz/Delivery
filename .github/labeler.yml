version: 1
appendOnly: true
# Labels aplicadas com base no padrão Conventional Commits
# https://www.conventionalcommits.org/en/v1.0.0/ e nos paths tocados pelo PR.
# Usadas pelo changelog automático (release-please) pra categorizar cada
# mudança. Mesmo padrão do Vectora, adaptado aos pacotes deste monorepo.
labels:
  # "!" antes do ":" marca breaking change — ex.: "feat!: remove endpoint antigo"
  - label: breaking-change
    title: "^[^:]+!:.*"
  - label: breaking-change
    body: "BREAKING CHANGE"
  - label: enhancement
    title: "^feat(\\(.+\\))?!?:.*"
  - label: bug
    title: "^fix(\\(.+\\))?!?:.*"
  - label: documentation
    title: "^docs(\\(.+\\))?!?:.*"
  - label: performance
    title: "^perf(\\(.+\\))?!?:.*"
  - label: ci
    title: "^ci(\\(.+\\))?!?:.*"
  - label: chore
    title: "^(chore|test|build|style|refactor)(\\(.+\\))?!?:.*"
  - label: backend
    files:
      - "^apps/casa-das-maquinas/.*"
  - label: frontend
    files:
      - "^apps/web/.*"
  - label: contracts
    files:
      - "^packages/contracts/.*"
  - label: domain
    files:
      - "^packages/domain/.*"
  - label: docs
    files:
      - "^docs/.*"
      - "^.*[.]md$"
