name: Artefatos de release mobile e desktop

# Release Please cria a tag e a GitHub Release. Os anexos nativos permanecem
# desativados até existirem os projetos Capacitor e Electron do Delivery.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    if: ${{ vars.NATIVE_BUILDS_ENABLED == 'true' }}
    name: APK Android · ${{ matrix.app }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @delivery/${{ matrix.app }} mobile:sync:android
      - name: Gerar APK
        working-directory: apps/${{ matrix.app }}/android
        run: bash gradlew assembleRelease --no-daemon
      - name: Anexar APK à release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk" --repo "$GITHUB_REPOSITORY" --clobber

  ios:
    if: ${{ vars.NATIVE_BUILDS_ENABLED == 'true' }}
    name: iOS · ${{ matrix.app }}
    runs-on: macos-latest
    strategy:
      matrix:
        app: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @delivery/${{ matrix.app }} mobile:sync:ios
      - name: Compilar app para simulador
        working-directory: apps/${{ matrix.app }}/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build

  desktop:
    if: ${{ vars.NATIVE_BUILDS_ENABLED == 'true' }}
    name: Electron · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        app: [web]
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @delivery/${{ matrix.app }} desktop:build
      - name: Publicar artefatos do Electron na release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" apps/${{ matrix.app }}/dist/* --repo "$GITHUB_REPOSITORY" --clobber
