name: D1 remote check

# Prova, num banco D1 REMOTO e descartável (nunca o de produção), que as migrações aplicam, revertem e
# reaplicam. O banco é criado com o prefixo delivery-check- e destruído ao final, mesmo em caso de falha.
# Execução manual; exige CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no Environment "Production".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-remote-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: delivery-check-${{ github.run_id }}
    defaults:
      run:
        working-directory: apps/casa-das-maquinas
    steps:
      - name: Check credentials
        id: credentials
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Verificação pulada: configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create the disposable database
        id: create
        if: steps.credentials.outputs.ready == 'true'
        run: |
          set -euo pipefail
          out="$(pnpm exec wrangler d1 create "$DB_NAME" --json)"
          id="$(node -e 'const o=JSON.parse(process.argv[1]); console.log(o.uuid ?? o.database_id ?? o.id)' "$out")"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Banco descartável: $DB_NAME ($id)"
      - name: Point the wrangler config at the disposable database
        if: steps.create.outputs.id != ''
        env:
          DB_ID: ${{ steps.create.outputs.id }}
        run: |
          set -euo pipefail
          # Guarda: só o banco criado agora pode ser alvo; nunca o id de produção.
          case "$DB_NAME" in delivery-check-*) ;; *) echo "::error::nome inesperado"; exit 1 ;; esac
          sed -i "s/00000000-0000-0000-0000-000000000000/${DB_ID}/; s/\"database_name\": \"casa-das-maquinas\"/\"database_name\": \"${DB_NAME}\"/" wrangler.jsonc
          grep -q "$DB_ID" wrangler.jsonc

      - name: Apply the migrations
        if: steps.create.outputs.id != ''
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Verify the schema exists
        if: steps.create.outputs.id != ''
        run: |
          set -euo pipefail
          out="$(pnpm exec wrangler d1 execute DB --remote --json --command "select name from sqlite_master where type='table' and name not like 'sqlite_%' and name not like '_cf_%' and name != 'd1_migrations'")"
          echo "$out"
          for table in restaurants orders payment_charges; do
            echo "$out" | grep -q "\"$table\"" || { echo "::error::tabela $table ausente após aplicar"; exit 1; }
          done
      - name: Roll back in reverse order
        if: steps.create.outputs.id != ''
        run: |
          set -euo pipefail
          for file in $(ls migrations-rollback/*.sql | sort -r); do
            echo "Revertendo $file"
            pnpm exec wrangler d1 execute DB --remote --yes --file="$file"
          done
      - name: Verify the database is empty again
        if: steps.create.outputs.id != ''
        run: |
          set -euo pipefail
          out="$(pnpm exec wrangler d1 execute DB --remote --json --command "select count(*) as n from sqlite_master where type='table' and name not like 'sqlite_%' and name not like '_cf_%' and name != 'd1_migrations'")"
          echo "$out"
          echo "$out" | grep -Eq '"n": *0' || { echo "::error::o rollback deixou tabelas"; exit 1; }
      - name: Re-apply the migrations
        if: steps.create.outputs.id != ''
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Destroy the disposable database
        if: always() && steps.create.outputs.id != ''
        run: |
          case "$DB_NAME" in delivery-check-*) pnpm exec wrangler d1 delete "$DB_NAME" --skip-confirmation ;; esac
