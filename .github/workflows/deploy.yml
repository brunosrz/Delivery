name: Deploy API Cloudflare

# Este workflow publica somente apps/api. Os web apps permanecem fora do deploy
# enquanto a migração da plataforma não estiver concluída.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente a publicar
        required: true
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: delivery-api-${{ github.event_name == 'pull_request' && 'preview' || (github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'preview')) }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"

jobs:
  preview:
    name: "API (Preview: D1 + Worker)"
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Validar credenciais
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Configure CLOUDFLARE_API_TOKEN no ambiente Preview."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID no ambiente Preview."; exit 1; }
          test "$D1_DATABASE_ID" = "7e64fb05-d729-4aae-9ff0-425831b69a31" || { echo "::error::D1_DATABASE_ID não corresponde ao banco Delivery Preview provisionado."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Testar API
        run: bun run test
      - name: Aplicar migrações no D1 de Preview
        run: bunx wrangler d1 migrations apply DB --remote --env preview
      - name: Publicar Worker de Preview
        run: bunx wrangler deploy --env preview

  production:
    name: "API (Production: D1 + Worker)"
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Validar credenciais
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Configure CLOUDFLARE_API_TOKEN no ambiente Production."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID no ambiente Production."; exit 1; }
          test "$D1_DATABASE_ID" = "c24822ba-9107-4a97-bab3-0e5ba01bff32" || { echo "::error::D1_DATABASE_ID não corresponde ao banco Delivery Production provisionado."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Testar API
        run: bun run test
      - name: Aplicar migrações no D1 de Production
        run: bunx wrangler d1 migrations apply DB --remote --env production
      - name: Publicar Worker de Production
        run: bunx wrangler deploy --env production
