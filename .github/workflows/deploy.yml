name: Deploy

# Publica em produção a cada push em main (linha estável) e sob demanda. Os
# passos são pulados, sem falhar, quando o secret correspondente não está
# configurado (ver .github/DEPLOYMENT.md). Secrets de produção vivem só no
# Environment "Production".
# Ordem: Worker da Casa das Máquinas (migrations D1 antes do código novo) e
# depois o web na Vercel, que consome a API publicada.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"
  VERCEL_CLI_VERSION: "65.9.0"

jobs:
  # Só o branch main publica; workflow_dispatch permite escolher outro branch
  # na interface e, sem esta checagem, publicaria em produção por engano.
  api:
    name: Casa das Máquinas (D1 + Worker)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Detect deployment credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_DATABASE_ID" ]; then
            echo "::notice::Deploy da API pulado: configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID e D1_DATABASE_ID."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.credentials.outputs.ready == 'true'
        name: Test before deploy
        run: pnpm --filter @delivery/casa-das-maquinas test
      - if: steps.credentials.outputs.ready == 'true'
        name: Point to the production D1 database
        working-directory: apps/casa-das-maquinas
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc
      # Migrations antes do Worker: o código novo pode assumir o schema novo.
      - if: steps.credentials.outputs.ready == 'true'
        name: Apply D1 migrations
        working-directory: apps/casa-das-maquinas
        run: |
          for attempt in 1 2 3; do
            if pnpm exec wrangler d1 migrations apply DB --remote; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "D1 migrations failed (attempt $attempt/3); retrying..."
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - if: steps.credentials.outputs.ready == 'true'
        name: Deploy Worker
        working-directory: apps/casa-das-maquinas
        run: pnpm exec wrangler deploy

  web:
    name: Web (Vercel)
    # !cancelled(): a falha da API não deve impedir a tentativa de publicar o
    # web, mas um cancelamento explícito do workflow deve.
    if: "!cancelled() && github.ref == 'refs/heads/main'"
    needs: [api]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Detect deployment credentials
        id: credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Deploy do web pulado: configure VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.credentials.outputs.ready == 'true'
        name: Pull Vercel production settings
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.credentials.outputs.ready == 'true'
        name: Build
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
      - if: steps.credentials.outputs.ready == 'true'
        name: Deploy
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Resumo
        if: always()
        run: |
          echo "## Deploy de produção" >> "$GITHUB_STEP_SUMMARY"
          echo "- Casa das Máquinas (Cloudflare Worker + D1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web (Vercel)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Passos sem secret configurado foram pulados (ver .github/DEPLOYMENT.md)." >> "$GITHUB_STEP_SUMMARY"
