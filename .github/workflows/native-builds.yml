name: Builds nativos (Capacitor e Electron)

# Os jobs ficam visíveis como skipped até Capacitor/Electron e os apps mobile
# serem migrados. Habilitar somente depois de adicionar plataformas e scripts.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ vars.NATIVE_BUILDS_ENABLED == 'true' }}
    name: Android · ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - name: Sincronizar Capacitor Android
        run: bun run --filter @delivery/${{ matrix.app }} mobile:sync:android
      - name: Compilar APK de validação
        working-directory: apps/${{ matrix.app }}/android
        run: bash gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ matrix.app }}-debug
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    if: ${{ vars.NATIVE_BUILDS_ENABLED == 'true' }}
    name: iOS · ${{ matrix.app }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Sincronizar Capacitor iOS
        run: bun run --filter @delivery/${{ matrix.app }} mobile:sync:ios
      - name: Compilar para simulador sem assinatura
        working-directory: apps/${{ matrix.app }}/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

  desktop:
    if: ${{ vars.NATIVE_BUILDS_ENABLED == 'true' }}
    name: Electron · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        app: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Empacotar Electron
        run: bun run --filter @delivery/${{ matrix.app }} desktop:build
