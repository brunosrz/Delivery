name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Valores dummy: o build e o E2E não acessam serviços externos.
    env:
      SUPABASE_URL: https://build.invalid.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://build.invalid.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: build-only-service-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
      NEXTAUTH_SECRET: build-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Build without external services
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @delivery/web exec playwright install --with-deps chromium
      - name: E2E smoke tests
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
