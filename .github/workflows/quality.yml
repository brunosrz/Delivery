name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - name: Import boundaries between workspace packages
        run: bun run check:boundaries
      - name: Python tests of the SCons automation
        run: python -m unittest discover -s tests -t . -p 'test_scons*.py'
      - run: bun run test:coverage
      - name: Build without external services
        run: bun run build
      - name: Install Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: bun run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  api:
    name: API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Migrations, rollbacks and journal are consistent
        run: node --test scripts/tests/migrations-integrity.test.mjs scripts/tests/migrations-rollback.test.mjs
      - name: Drizzle migration check
        working-directory: apps/api
        run: bunx drizzle-kit check
      - name: Schema has no drift from the migrations
        working-directory: apps/api
        run: node scripts/check-schema-drift.mjs
      - name: Generated Worker types are up to date
        working-directory: apps/api
        # Os segredos entram nos tipos a partir de .dev.vars; o exemplo versionado os declara de forma determinística.
        run: |
          cp .dev.vars.example .dev.vars
          bunx wrangler types --strict-vars=false --check src/worker-configuration.d.ts
      - name: OpenAPI snapshot is up to date
        run: |
          bun run --filter @delivery/api openapi:export
          git diff --exit-code packages/contracts/openapi/v1.json
      - name: Worker bundles (deploy dry run)
        working-directory: apps/api
        run: bun run deploy:dry-run
      - name: Tests with coverage
        working-directory: apps/api
        run: bun run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Dependency audit (critical blocks, high warns)
        run: |
          bun audit --prod --audit-level=critical
          bun audit --prod --audit-level=high || echo "::warning::advisories de severidade alta em dependências de produção"

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
